<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="charlie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background hexagon / rounded diamond -->
  <rect x="12" y="12" width="76" height="76" rx="22" fill="#13151A" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Glowing central node -->
  <circle cx="50" cy="50" r="14" fill="url(#charlie-grad)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="7" fill="#FFFFFF"/>
  <!-- Technical orbiting satellites/nodes -->
  <circle cx="50" cy="24" r="3.5" fill="#8B7CFF" />
  <circle cx="76" cy="50" r="3.5" fill="#38BDF8" />
  <circle cx="50" cy="76" r="3.5" fill="#8B7CFF" />
  <circle cx="24" cy="50" r="3.5" fill="#38BDF8" />
  <!-- Circuit connecting arcs -->
  <path d="M 50 30 A 20 20 0 0 1 70 50" stroke="rgba(139, 124, 255, 0.4)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M 50 70 A 20 20 0 0 1 30 50" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
