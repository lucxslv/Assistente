[project]
name = "assistente"
version = "0.2.0"
description = "Assistente pessoal autônoma com IA, voz, memória e ferramentas extensíveis"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "psutil>=5.9.0",
    "openwakeword>=0.4.0",
    "yt-dlp>=2026.7.4",
    "python-vlc>=3.0.21203",
    "ddgs>=9.14.4",
    "beautifulsoup4>=4.15.0",
    "pycaw>=20251023",
    "comtypes>=1.4.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio", "brain", "core", "memory", "providers", "tools", "events", "skills"]
