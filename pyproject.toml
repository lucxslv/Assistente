[project]
name = "assistente"
version = "0.1.0"
description = "Assistente pessoal com IA, voz e wake word"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "psutil>=5.9.0",
    "pvporcupine>=3.0.0",
]

[project.scripts]
assistente = "assistente:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"