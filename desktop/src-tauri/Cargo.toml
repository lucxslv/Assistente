[package]
name = "desktop"
version = "1.0.0"
description = "Charlie Desktop App"
authors = ["Lucas da Silva Costa"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
